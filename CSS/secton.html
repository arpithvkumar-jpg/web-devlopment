<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product cards</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
   <h1>Product List </h1>
    <div class="product-list">


        <div class="product-card">
            <img src="https://m.media-amazon.com/images/I/71l8OQYpEiL._AC_UF894%2C1000_QL80_.jpg" alt="" width="150px" height="150px">
            <h3>Wireless Bluetooth Headphones</h3>
            <p>30% OFF</p>
            <p>⭐ 4.4 (1,256 reviews)</p>
            <strong>₹1,999</strong>
            <div class="btn">
                <button class="button">Add Cart</button>
                <button class="button">Buy Now</button>
            </div>
        </div>

        <div class="product-card">
            <img src="https://m.media-amazon.com/images/I/61L0IA%2BA-LL.jpg" alt="" width="150px" height="150px">
            <h3>Smart Fitness Watch</h3>
            <p>40% OFF</p>
            <p>⭐4.2 (980 reviews)</p>
            <strong>₹2,999</strong>
            <div class="btn">
                <button class="button">Add Cart</button>
                <button class="button">Buy Now</button>
            </div>
        </div>

        <div class="product-card">
            <img src="https://m.media-amazon.com/images/I/61Vot5AF44L._AC_UY900_.jpg" alt="" width="150px" height="150px">
            <h3>Running Sports Shoes</h3>
            <p>35% OFF</p>
            <p>⭐ 4.5 (2,104 reviews)</p>
            <strong>₹3,499</strong>
            <div class="btn">
                <button class="button">Add Cart</button>
                <button class="button">Buy Now</button>
            </div>
        </div>

     </div>

</body>
</html>
